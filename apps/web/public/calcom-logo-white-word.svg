<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="110" height="26" viewBox="0 0 110 26">
<!-- ServiceAI wordmark, frozen at 4x from the approved macOS rendering.
     Previously this used live <text> in system fonts, so the letterforms changed on
     every OS (SF Pro / Segoe UI / Roboto). Raster keeps the mark identical everywhere.
     Source PNG is 440x104 for a 110x26 canvas = 4x, so it stays crisp on retina. -->
<image x="0" y="0" width="110" height="26" xlink:href="data:image/png;base64,"/>
</svg>
